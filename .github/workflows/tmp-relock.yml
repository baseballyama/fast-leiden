name: tmp relock (temporary, delete after use)

# Temporary helper (ci-tmp/relock-fast-leiden only, never merged).
# Fresh lock-file maintenance candidate for #16, measured on a runner:
# package.json is pinned to main; the lockfile is regenerated from scratch
# (what Renovate's lockFileMaintenance does) and compared with main's lock
# and with the original #16 head. Earlier runs are kept in git history.

on:
  push:
    branches: ["ci-tmp/relock-fast-leiden"]

permissions:
  contents: read

env:
  MAIN: 9d562b10682808bbcf456067dae9aa938041f380
  PR16: 74e688d568b890b9b1ad5328bd3efadaf2e7d8c8

jobs:
  pr16-head-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 50dfd7aa68c2105692c43c7cf9740b07c12ea62a
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: pnpm format on #16 head (renovate 50dfd7a)
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          git rev-parse HEAD | tee "$OUT/head.txt"
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee "$OUT/install.log"
          pnpm format
          git status --porcelain | tee "$OUT/status.txt"
          git diff > "$OUT/format.diff"
          wc -c "$OUT/format.diff"
          test ! -s "$OUT/format.diff"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr16-head-format
          path: ${{ runner.temp }}/out/
          retention-days: 7
